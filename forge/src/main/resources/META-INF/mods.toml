modLoader = "javafml"
loaderVersion = "[66,)"
license = "MIT"
clientSideOnly = true

[[mods]]
modId = "${modId}"
version = "${minecraftVersion}-${modVersion}"
displayName = "${modName}"
authors = "${modAuthor}"
credits = "${modContributors}"
description = "${modDescription}"
logoFile = "logo.png"
displayURL = "${modUrl}"

[modproperties.${modId}]
incompatibleMods = ["betterthirdperson", "customcameraview", "nimble"]

[[dependencies.${modId}]]
modId = "minecraft"
mandatory = true
versionRange = "[26.3,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${modId}]]
modId = "forgeconfigapiport"
mandatory = true
versionRange = "[26.3,)"
ordering = "NONE"
side = "CLIENT"
